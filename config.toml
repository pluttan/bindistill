# Binary distillation settings.
#
# Pick a preset with `make train PRESET=tiny` or `--preset tiny`; a preset is a
# patch applied on top of everything below. Single values can be overridden on
# the command line with `--set train.lr=1e-4`, which is also what the log
# records, so a run can always be reproduced from its own header.

preset = "small"

[run]
name = "default"        # runs/<name>/ holds checkpoints, logs and metrics
device = "auto"         # auto | cuda | cuda:1 | mps | cpu
seed = 0

[paths]
models = "assets/models"   # local snapshot of teacher weights and tokeniser
corpus = "assets/corpus"   # tokenised training text
runs = "runs"

[model]
teacher = "Qwen/Qwen3-0.6B"
binary = true           # false turns this into an ordinary fine-tune
group = 128             # weights sharing one scale; 128 gives 1.125 bits/weight
ste_clip = 1.0          # straight-through window, in units of the group scale
freeze_full_precision = true   # train the binary layers only

[data]
kind = "fineweb"        # fineweb | dolma | text
dolma_version = "v1_7"
subsets = []            # dolma only: e.g. ["books", "c4-filtered", "pes2o"]
repo = "HuggingFaceFW/fineweb-edu"
shard = "sample/10BT/{:03d}_00000.parquet"
text_file = ""          # used when kind = "text"
train_tokens = 100_000_000
eval_tokens = 1_000_000

# Reading a corpus over https takes as long as it takes, and a socket will
# time out somewhere in the middle of it. A shard that breaks is re-opened and
# resumed from the line after the last one handed out; after this many failed
# attempts that one file is skipped rather than the whole fetch abandoned.
retries = 5
timeout = 120

[train]
objective = "distill"   # distill = match a teacher; language = next token only
seq = 1024
micro_batch = "auto"   # largest that fits, probed on the machine; or a number
accum = 8
lr = 2e-4               # master weights
scale_lr = 5e-3         # group scales move faster; they start at the wrong value
warmup = 200
grad_clip = 1.0
alpha = 0.9             # weight on the teacher's distribution vs. the real token
temperature = 1.0
max_tokens = 3.0e8      # stop here; a checkpoint is written first

# Stop when the run stops paying for itself: if held-out perplexity is falling
# by less than this many points per hour, training ends and the final
# checkpoint is written. Zero disables it and runs to max_tokens.
# 0.05 is a backstop rather than a dial - replayed against a real 300M-token
# run it never fires, because that run never fell slower than 0.25 an hour.
# It ends the runs that have genuinely flattened out, and leaves the rest to
# max_tokens. Raise it to cut the tail short instead; the README has the
# replayed numbers for each value.
min_improvement_per_hour = 0.05

# How many hours the rate is measured over. Three, not one: replaying the same
# run with a one-hour window, a single noisy check in hour five reads as a
# stall and ends the run 190M tokens and six perplexity points early.
improvement_window_hours = 3.0

# How many checks in a row must be below the threshold. Checks scatter by more
# than a low threshold is worth: around a true rate of 0.05 an hour, a single
# unlucky measurement reads as a stall. Two in a row costs one evaluation and
# makes the low threshold usable.
stop_patience = 2

dtype = "bfloat16"
gradient_checkpointing = true
loss_chunk = 256        # tokens per slice when comparing distributions
log_every = 10
eval_every = 500
checkpoint_every = 250
keep_checkpoints = 3
dataloader_workers = 2

[eval]
windows = 32            # held-out windows of `train.seq` tokens
baselines = true        # measure the teacher and the untrained binarisation too


# ==============================
# ===  Presets               ===
# ==============================

# Fifteen minutes on almost anything, including a CPU. Proves the pipeline runs
# end to end; the resulting model is not meant to be good.
[presets.smoke]
[presets.smoke.run]
name = "smoke"
[presets.smoke.model]
teacher = "HuggingFaceTB/SmolLM2-135M"
[presets.smoke.data]
train_tokens = 2_000_000
eval_tokens = 200_000
[presets.smoke.train]
seq = 256
micro_batch = 2
accum = 2
max_tokens = 2.0e6
warmup = 20
eval_every = 100
checkpoint_every = 100
log_every = 5
[presets.smoke.eval]
windows = 8

# A real but small run: 135M parameters, one consumer card, a few hours.
[presets.tiny]
[presets.tiny.run]
name = "tiny"
[presets.tiny.model]
teacher = "HuggingFaceTB/SmolLM2-135M"
[presets.tiny.data]
train_tokens = 300_000_000
[presets.tiny.train]
seq = 1024
micro_batch = "auto" # 8 did not fit in 8 GB; the probe settles it per machine
accum = 16           # micro x accum is the step size and is kept
loss_chunk = 128
max_tokens = 2.0e8
lr = 3e-4

# 0.6B on a 24 GB card. This is the default.
[presets.small]
[presets.small.run]
name = "small"
[presets.small.model]
teacher = "Qwen/Qwen3-0.6B"
[presets.small.train]
seq = 1024
micro_batch = "auto"   # largest that fits, probed on the machine; or a number
accum = 8
max_tokens = 3.0e8

# Ordinary fine-tuning on a mixture of domains, no teacher and no binary
# weights. Same loop, same checkpoints, same resume.
[presets.finetune]
[presets.finetune.run]
name = "finetune"
[presets.finetune.model]
binary = false
[presets.finetune.train]
objective = "language"
lr = 1e-5
seq = 1024
micro_batch = "auto"
accum = 8
max_tokens = 1.0e9
[presets.finetune.data]
kind = "dolma"
subsets = []         # empty takes every source; name them to pick domains
train_tokens = 1_100_000_000
[presets.finetune.eval]
baselines = false

# 1.7B, the size the Bonsai measurements were made against. Needs 40 GB or
# several cards under torchrun; expect days rather than hours.
[presets.full]
[presets.full.run]
name = "full"
[presets.full.model]
teacher = "Qwen/Qwen3-1.7B"
[presets.full.data]
train_tokens = 2_000_000_000
[presets.full.train]
seq = 2048
micro_batch = 1
accum = 16
max_tokens = 1.0e10
warmup = 500
